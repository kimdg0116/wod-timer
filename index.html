<script>if (/Android/i.test(navigator.userAgent)) document.documentElement.classList.add('android');
// 393보다 좁은 폰(갤럭시 360·384)은 393 폭으로 그린 뒤 줄인다. 접는 폰은 폭이 바뀔 때마다 다시
{ const fit = () => { const m = document.querySelector('meta[name=viewport]'), v = screen.width < 393 ? 'width=393, user-scalable=no, viewport-fit=cover'
    : 'width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover'; if (m.content !== v) m.content = v; };
  fit(); addEventListener('resize', fit); }
try {                                                                  // 테마 색·화면 모드는 첫 화면부터. 타이머라 처음엔 어둡게
  const c = localStorage.getItem('wod-color') || 'charcoal', t = localStorage.getItem('wod-theme') || 'dark';   // 같은 주소의 다른 앱과 섞이지 않게 이 앱만의 칸
  if (c !== 'blue') document.documentElement.dataset.color = c;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
} catch (e) { document.documentElement.dataset.theme = 'dark'; document.documentElement.dataset.color = 'charcoal'; }
// 도시메트리 캘린더와 같은 링크 열기 (?open=chrome / ?open=safari): 카톡·삼성 인터넷 등으로 열렸으면 크롬·사파리로 다시 연다 (홈 화면 설치가 되게). 주소의 표시는 지운다
(() => {
  const want = new URLSearchParams(location.search).get('open'), ua = navigator.userAgent, home = location.origin + location.pathname;
  if (!want) return;
  history.replaceState(null, '', home);
  if (want === 'chrome' && /Android/i.test(ua) && (!/Chrome\//.test(ua) || /SamsungBrowser|EdgA|OPR|Whale|KAKAOTALK|NAVER|; wv\)/.test(ua)))
    location.replace(`intent://${location.host}${location.pathname}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(home)};end`);
  if (want === 'safari' && /iPhone|iPad/.test(ua) && /CriOS|FxiOS|EdgiOS|KAKAOTALK|NAVER|Whale/.test(ua))
    location.replace('x-safari-' + home);                             // iOS 17 이상
})();

/* 구간 색 4가지 (TimerPlus 와 같은 노랑·연두·빨강·파랑). 판 위 글자는 늘 검정 */
:root { --py:#F2F25C; --pg:#A6EE6A; --pr:#E9573F; --pb:#5AA8E6; --ink:#111; --pcw:58%;
  --gut:max(16px, calc((100vw - 400px) / 2)); --num:Oswald, "SUIT Variable", sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pcw:100%; } }
:root[data-theme="dark"] { --pcw:100%; }
/* 테마 색마다 구간 색 4가지. 역할은 그대로 (노랑 계열 준비 · 초록 운동 · 빨강 휴식 · 파랑 쿨 다운),
   온도·채도는 테마를 따르고 한 칸은 테마 색을 옅게 쓴 것. 검정 숫자 대비 6:1 이상. 차콜(기본)은 위 :root 의 TimerPlus 색 그대로 */
:root:not([data-color])      { --py:#FFD54A; --pg:#4FE3A0; --pr:#FF6B6B; --pb:#6FA3FF; }   /* 파랑: 선명하고 깨끗하게 */
:root[data-color="sky"]      { --py:#FFE680; --pg:#7FEBC0; --pr:#FF9494; --pb:#79CCF5; }   /* 스카이: 밝고 가볍게 */
:root[data-color="navy"]     { --py:#F2C14E; --pg:#5FCB8E; --pr:#EE6A5F; --pb:#8AA9E6; }   /* 네이비: 깊게 */
:root[data-color="cobalt"]   { --py:#FFE94D; --pg:#3EF0A0; --pr:#FF5C66; --pb:#7C9CFF; }   /* 코발트: 전기처럼 선명하게 */
:root[data-color="mint"]     { --py:#F5E06A; --pg:#4FE0C0; --pr:#FF8E7A; --pb:#8CBDF2; }   /* 민트: 운동 칸이 민트 */
:root[data-color="sage"]     { --py:#E5C76B; --pg:#A9CC9B; --pr:#DE8F76; --pb:#9DB8CC; }   /* 세이지: 황토·세이지·테라코타·슬레이트 */
:root[data-color="teal"]     { --py:#F4D35E; --pg:#7EE0A8; --pr:#F2836B; --pb:#4FC4D9; }   /* 틸: 쿨 다운 칸이 틸 */
:root[data-color="lavender"] { --py:#F7E39A; --pg:#A5E8C6; --pr:#F5A3B5; --pb:#AFA6F2; }   /* 라벤더: 파스텔 */
:root[data-color="lilac"]    { --py:#F8DB9A; --pg:#B2E3B5; --pr:#F59AC0; --pb:#CDA8EE; }   /* 라일락: 분홍빛 파스텔 */
:root[data-color="indigo"]   { --py:#FFD76E; --pg:#84E3B5; --pr:#FF8597; --pb:#9F98F7; }   /* 인디고: 진한 파스텔 */
:root[data-color="coral"]    { --py:#FFD15C; --pg:#A3DB72; --pr:#FF8566; --pb:#74C3DE; }   /* 코랄: 휴식 칸이 코랄 */
:root[data-color="apricot"]  { --py:#FFBE6A; --pg:#B9DB72; --pr:#F07B66; --pb:#82BEDA; }   /* 살구: 준비 칸이 살구 */
:root[data-color="rose"]     { --py:#FFD27F; --pg:#94DDB4; --pr:#F5839E; --pb:#92B6F0; }   /* 로즈: 휴식 칸이 로즈 */
:root[data-color="bluegray"] { --py:#E6D388; --pg:#9ACDB5; --pr:#E39A90; --pb:#9DB6D4; }   /* 블루 그레이: 차분하고 차갑게 */
:root[data-color="warmgray"] { --py:#EBCB80; --pg:#A8C58C; --pr:#DD9A82; --pb:#B8C2CB; }   /* 웜 그레이: 따뜻한 셋 + 쿨 다운만 차가운 회청 (멀리서도 구분) */

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:pan-x pan-y; }
html { overscroll-behavior-y:none; touch-action:pan-x pan-y; -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--bg-top); }
body { margin:0; overflow:hidden; overscroll-behavior-y:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  font:16px/1.5 var(--font-body); background:var(--bg-top); color:var(--fg); letter-spacing:-.01em; }
input, textarea { -webkit-user-select:text; user-select:text; }
[hidden] { display:none !important; }
button { font-family:inherit; color:inherit; cursor:pointer; }
button svg { pointer-events:none; }   /* 아이콘 대신 버튼이 누름을 받는다 */
#play { touch-action:none; flex-shrink:0; }
.tabs button { touch-action:none; }   /* 버튼 위의 작은 손 떨림을 스크롤로 처리하지 않는다 */
#playLand { touch-action:none; flex-shrink:0; display:none; }
#resetLand { display:none; }
body.run .upd { display:none; }       /* 운동 중엔 새 버전 버튼이 버튼을 가리지 않게 */
@font-face { font-family:Oswald; src:url(https://cdn.jsdelivr.net/npm/@fontsource-variable/oswald@5.1.1/files/oswald-latin-wght-normal.woff2) format("woff2-variations"); font-weight:200 700; font-display:block; }
@font-face { font-family:"SUIT Variable"; src:url(https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/variable/woff2/SUIT-Variable.woff2) format("woff2-variations"); font-weight:100 900; font-display:block; }
.num { font-family:var(--num); font-variant-numeric:tabular-nums; }

/* 타이머 화면: 위 바 / 지금 구간 / 다음 구간 / 버튼 / 탭.
   판 색은 화면 끝(다이나믹 아일랜드·홈 막대 아래)까지 채우고 글자·버튼만 안전 영역 안에 둔다.
   크기는 vmin 으로 폰·패드에 맞춘다 (아이폰은 최솟값 그대로, 패드에서 커진다) */
:root { --sl:env(safe-area-inset-left, 0px); --sr:env(safe-area-inset-right, 0px); --st:env(safe-area-inset-top, 0px); --sb:env(safe-area-inset-bottom, 0px);
  --ib:clamp(42px, 6vmin, 60px); --t1:clamp(17px, 2.4vmin, 26px); --sn:clamp(54px, 9vmin, 120px); --s2:clamp(15px, 2.1vmin, 24px);
  --play:clamp(86px, 13vmin, 170px); --ti:clamp(24px, 3.4vmin, 34px); --tf:clamp(11.5px, 1.6vmin, 16px); }
#app { position:fixed; inset:0; background:var(--bg-top); display:grid; grid-template-columns:minmax(0, 1fr);   /* iOS 26 상태 막대는 맨 위 고정 요소(#app)의 배경색을 쓴다 */
  grid-template-rows:auto minmax(0, 1fr) clamp(84px, 14dvh, 220px) auto auto; grid-template-areas:"top" "cur" "nxt" "ctl" "tabs"; }
.top { grid-area:top; background:var(--bg-top); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; padding:calc(6px + var(--st)) max(12px, var(--sr)) 8px max(12px, var(--sl)); }
.top .r { display:flex; justify-content:flex-end; gap:6px; }
.ibtn { display:grid; place-items:center; width:var(--ib); height:var(--ib); padding:0; border:0; border-radius:50%; background:none; color:var(--acc); }
.ibtn svg { width:57%; height:57%; }
.ibtn.ring { box-shadow:inset 0 0 0 2px currentColor; }
.ttl { text-align:center; line-height:1.2; white-space:nowrap; }
.ttl b { display:block; font-size:var(--t1); font-weight:800; }
.ttl span { font-size:var(--t1); font-weight:500; color:var(--mute); letter-spacing:.03em; }
.pane { position:relative; container-type:size; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden;
  background:var(--pc, var(--card)); color:var(--ink); }
.pane.off { background:var(--card); color:var(--mute); }
#cur { grid-area:cur; }
#nxt { grid-area:nxt; }
.lab { max-width:96%; overflow:hidden; text-overflow:ellipsis; font-weight:800; line-height:1.1; letter-spacing:-.02em; white-space:nowrap; }
.dig { font-family:var(--num); font-weight:700; line-height:.95; white-space:nowrap; }
.dig i { display:inline-block; width:.55em; text-align:center; font-style:normal; }   /* 이 Oswald 파일은 고정폭 숫자(tnum)를 무시한다. 칸을 고정해 숫자가 흔들리지 않게 */
#cur .lab { font-size:min(12cqw, 15cqh); margin-bottom:1cqh; }
#cur .dig { font-size:min(37cqw, 62cqh); }
#cur.long .dig { font-size:min(30cqw, 50cqh); }
#nxt .lab { font-size:min(5.6cqw, 23cqh); font-weight:700; }
#nxt .dig { font-size:min(17cqw, 54cqh); }
.ctl { grid-area:ctl; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:12px max(12px, var(--sr)) 6px max(12px, var(--sl)); }
.stat { text-align:center; min-width:0; }
.stat b { display:block; font-family:var(--num); font-size:var(--sn); font-weight:600; line-height:1; color:color-mix(in srgb, var(--pc) var(--pcw), var(--fg)); }
.stat span { display:block; margin-top:6px; font-size:var(--s2); font-weight:700; white-space:nowrap; }
.go { display:flex; flex-direction:column; align-items:center; gap:4px; }
.play { display:grid; place-items:center; width:var(--play); height:var(--play); padding:0; border:0; border-radius:50%; background:var(--pc); color:var(--ink);
  box-shadow:inset 0 0 0 calc(var(--play) * .07) var(--pc), inset 0 0 0 calc(var(--play) * .105) var(--ink); }
.play svg { width:40%; height:40%; }
.go span { font-size:var(--s2); font-weight:800; color:color-mix(in srgb, var(--pc) var(--pcw), var(--fg)); }
/* 탭: TimerPlus 처럼 홈 막대 위에 붙인다 (바닥 안전 영역 - 8px) */
.tabs { grid-area:tabs; display:flex; justify-content:space-around; gap:6px; padding:4px max(12px, var(--sr)) max(6px, calc(var(--sb) - 8px)) max(12px, var(--sl)); border-top:1px solid var(--line); }
.tabs button { flex:1; max-width:160px; display:flex; flex-direction:column; align-items:center; gap:1px; padding:5px 0 3px; border:0; border-radius:14px; background:none; color:var(--mute); font-size:var(--tf); font-weight:700; }
.tabs button svg { width:var(--ti); height:var(--ti); }
.tabs button.on { background:var(--soft); color:var(--acc); }
/* 실행 중에도 다른 모드로 이동할 수 있다. 떠나는 모드의 시간은 일시정지해 유지한다. */
/* 가로 (운동하면서 2~5m 밖에서 보는 화면): 화면 전체가 지금 구간 색, 그 위에 큰 숫자 하나.
   위는 얇은 머리줄(제목·총 시간 | 구간 이름 | 시작), 아래는 차콜 띠 하나(남은 라운드 | 다음 구간 칩 | 남은 사이클).
   탭·설정·편집은 숨긴다 (바꾸려면 세로로). 조작 버튼은 회전 때 DOM에서 옮기지 않는다 */
@media (orientation:landscape) {
  #play, #resetBtn { display:none !important; }
  #playLand, #resetLand:not([hidden]) { display:grid; }
  #app { grid-template-rows:auto minmax(0, 1fr) auto; grid-template-areas:"top" "cur" "ctl"; background:var(--now); color:var(--ink); }
  .tabs, .top [data-act=settings], #editBtn, #playLab { display:none !important; }
  .top { grid-template-columns:1fr auto 1fr; padding:max(8px, var(--st)) 16px 0; background:none; }
  .top .l { display:flex; align-items:center; gap:2.4vh; min-width:0; }
  .ttl { display:flex; align-items:baseline; gap:.35em; text-align:left; color:var(--ink); opacity:.62; }
  .ttl b, .ttl span { font-size:4.6vh; color:inherit; }
  .ttl span { font-family:var(--num); font-weight:600; }
  .top .lab { max-width:none; overflow:visible; font-size:12vh; line-height:1.05; color:var(--ink); }
  .top .r { justify-content:flex-end; }
  .top .ibtn.ring, .top .play { width:13vh; height:13vh; background:var(--bg-top); color:var(--now); box-shadow:none; }
  .top .play svg { width:40%; height:40%; }
  #cur { padding:0 var(--sr) 0 var(--sl); background:none; }
  #cur .dig { font-size:min(37cqw, 90cqh); margin-bottom:5cqh; }   /* Oswald 숫자는 줄 상자 아래쪽에 앉아서 조금 올린다 */
  #cur.long .dig { font-size:min(29cqw, 92cqh); }
  .ctl { grid-template-columns:1fr 2.6fr 1fr; height:calc(18vh + var(--sb) * .4); padding:0 max(8px, var(--sr)) calc(var(--sb) * .4) max(8px, var(--sl)); background:var(--bg-top); color:var(--fg); }
  .stat b { font-size:12vh; line-height:.95; }
  .stat span { margin-top:.4vh; font-size:2.8vh; color:var(--mute); }
  .go { display:flex; align-items:stretch; height:100%; padding:1.8vh 0; }
  #nxt { flex:1; flex-direction:row; align-items:center; justify-content:center; gap:2.4vh; border-radius:1.8vh; }
  #nxt::before { content:'다음'; font-size:3.4vh; font-weight:700; opacity:.6; }
  #nxt.off::before { content:none; }
  #nxt .lab { max-width:none; font-size:min(50cqh, 7cqw); }
  #nxt .dig { font-size:min(60cqh, 9cqw); }
}

/* 시트 (설정 · 타이머 편집) */
body.modal-open { overflow:hidden; }
.panel { position:fixed; inset:0; z-index:35; display:flex; align-items:flex-end; justify-content:center; background:rgba(0, 0, 0, .5); }
.sheet { width:100%; max-width:480px; max-height:calc(100dvh - 20px - env(safe-area-inset-top, 0px)); overflow-y:auto; padding:0 16px calc(18px + env(safe-area-inset-bottom, 0px));
  border-radius:20px 20px 0 0; background:var(--card); color:var(--fg); }
@media (min-width:600px), (orientation:landscape) { .panel { align-items:center; } .sheet { border-radius:20px; max-height:calc(100dvh - 20px); } }
.head { position:sticky; top:0; z-index:2; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; margin:0 -16px 4px; padding:12px 16px 10px; background:var(--card); border-bottom:1px solid var(--line); }
.head h3 { margin:0; font-size:17px; font-weight:800; }
.head button { justify-self:start; height:36px; padding:0 2px; border:0; background:none; font-size:16px; font-weight:600; color:var(--mute); }
.head button.ok { justify-self:end; color:var(--acc); font-weight:800; }
.sec { display:flex; justify-content:space-between; margin:16px 0 2px; font-size:13px; font-weight:700; color:var(--mute); }
.sec .num { font-size:14px; letter-spacing:.03em; }
.frow { display:flex; align-items:center; gap:10px; width:100%; padding:11px 0; border:0; border-top:1px solid var(--line); background:none; text-align:left; font:inherit; }
.sec + .frow { border-top:0; }
.frow .dot { flex:none; width:12px; height:12px; border-radius:50%; background:var(--pc); }
.frow .t { flex:1; min-width:0; padding:0; border:0; background:none; text-align:left; font:inherit; }
.frow .t b { display:block; font-size:16px; font-weight:700; }
.frow .t small { display:block; font-size:12.5px; color:var(--mute); }
.frow .v { font-family:var(--num); font-size:26px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; }
.frow .chev { flex:none; width:16px; height:16px; color:var(--mute); }
.frow .ibtn { width:36px; height:36px; color:var(--mute); }
.frow .ibtn svg { width:20px; height:20px; }
.addrow { display:flex; gap:8px; padding:12px 0 4px; border-top:1px solid var(--line); }
.sec + .addrow { border-top:0; }
.addrow input { flex:1; min-width:0; padding:9px 12px; font:inherit; font-size:16px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); }
.pill.del { border-color:var(--pr); color:var(--pr); }
/* 시간 고르기 바퀴 */
.wheels { display:flex; justify-content:center; align-items:center; gap:10px; padding:18px 0 12px; }
.wheels > span { font-size:17px; font-weight:700; }
.wbox { position:relative; }
.wbox::before { content:''; position:absolute; left:0; right:0; top:50%; height:64px; margin-top:-32px; border-radius:18px; background:var(--soft); }
.wheel { position:relative; width:88px; height:320px; padding:128px 0; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none;
  -webkit-mask-image:linear-gradient(transparent, #000 32%, #000 68%, transparent); mask-image:linear-gradient(transparent, #000 32%, #000 68%, transparent); }
.wheel::-webkit-scrollbar { display:none; }
.wheel div { display:grid; place-items:center; height:64px; scroll-snap-align:center; font-family:var(--num); font-size:44px; font-weight:700; color:var(--mute); font-variant-numeric:tabular-nums; }
.wheel div.on { color:var(--fg); }
.pcs { display:flex; margin:10px -16px 0; }
.pcs button { flex:1; display:grid; place-items:center; height:56px; border:0; background:var(--pc); color:var(--ink); }
.pcs button svg { width:24px; height:24px; }
/* 설정 줄 */
.settings-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; border-top:1px solid var(--line); }
.head + .settings-row { border-top:0; }
.settings-row b { display:block; font-size:16px; }
.settings-row p { margin:3px 0 0; font-size:13px; color:var(--mute); }
.settings-row.col { flex-direction:column; align-items:stretch; }
.icon-btn { flex:none; display:grid; place-items:center; width:44px; height:40px; padding:0; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--acc); }
.icon-btn svg { width:18px; height:18px; }
.seg { display:flex; flex:none; gap:4px; width:120px; padding:3px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
.seg button { flex:1; padding:7px 4px; font-size:15px; border:0; border-radius:8px; background:none; color:var(--mute); white-space:nowrap; }
.seg button.on { background:var(--card); color:var(--acc); font-weight:700; box-shadow:0 1px 4px color-mix(in srgb, var(--acc) 15%, transparent); }
.pills { display:flex; flex-wrap:wrap; gap:6px; }
.pill { flex:none; padding:7px 14px; font-size:14px; font-weight:700; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--mute); }
.pill.on { border-color:var(--acc); background:var(--soft); color:var(--acc); }
.swatches { display:flex; flex-wrap:wrap; gap:10px; }
.swatches button { width:32px; height:32px; padding:0; border:3px solid var(--card); border-radius:50%; background:var(--sw); box-shadow:0 0 0 1px var(--line); }
.swatches button.on { box-shadow:0 0 0 2px var(--fg); }
input[type=range] { width:100%; accent-color:var(--acc); }
select { width:100%; padding:9px 10px; font:inherit; font-size:15px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); }
.ver { margin:14px 0 0; text-align:right; font-family:Oswald, sans-serif; font-size:11px; letter-spacing:.06em; color:var(--mute); }
/* 업데이트 · 토스트 */
.upd { position:fixed; left:var(--gut); right:var(--gut); bottom:calc(20px + env(safe-area-inset-bottom, 0px)); z-index:30; padding:13px; font-size:15px; font-weight:700; border:0; border-radius:12px; background:var(--acc); color:#fff; box-shadow:0 6px 20px rgba(0, 0, 0, .3); }
#toast { position:fixed; left:var(--gut); right:var(--gut); top:calc(70px + env(safe-area-inset-top, 0px)); z-index:40; padding:13px; border-radius:12px; background:var(--toast); color:#fff; font-weight:600; text-align:center; opacity:0; transition:opacity .2s; pointer-events:none; }
#toast.show { opacity:.97; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="l"><button type="button" class="ibtn" data-act="settings" aria-label="설정 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>
    <div class="ttl"><b id="mname"></b><span id="total" class="num"></span></div>
    <div class="r">
      <button type="button" class="ibtn ring" id="resetBtn" data-act="reset" aria-label="처음으로 되돌리기" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5"/></svg></button>
      <button type="button" class="ibtn ring" id="resetLand" data-act="reset" aria-label="처음으로 되돌리기" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5"/></svg></button>
      <button type="button" class="ibtn" id="editBtn" data-act="edit" aria-label="타이머 설정 바꾸기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
      <button type="button" class="play" id="playLand" data-act="play" aria-label="시작"></button>
    </div>
  </div>
  <section class="pane" id="cur"><div class="lab" id="curLab"></div><div class="dig" id="curDig"></div></section>
  <section class="pane" id="nxt"><div class="lab" id="nxtLab"></div><div class="dig" id="nxtDig"></div></section>
  <div class="ctl">
    <div class="stat" id="statR"><b></b><span>남은 라운드</span></div>
    <div class="go"><button type="button" class="play" id="play" data-act="play" aria-label="시작"></button><span id="playLab"></span></div>
    <div class="stat" id="statY"><b></b><span>남은 사이클</span></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>

<div id="settings" class="panel" role="dialog" aria-modal="true" aria-labelledby="setTitle" hidden><div class="sheet">
  <div class="head"><span></span><h3 id="setTitle">설정</h3><button type="button" class="ok" data-act="closeSettings">완료</button></div>
  <div class="settings-row"><div><b>화면 모드</b><p id="themeMode"></p></div><button type="button" id="theme" class="icon-btn" data-act="theme" aria-label="화면 모드 바꾸기"></button></div>
  <div class="settings-row col"><div><b>테마 색</b><p id="colorName"></p></div><div class="swatches" id="colorPick"></div></div>
  <div class="settings-row"><div><b>소리</b><p>구간이 바뀔 때와 마지막 3초</p></div><div class="seg" id="setSound"></div></div>
  <div class="settings-row col"><div><b>소리 종류</b><p>누르면 미리 들려줘요</p></div><div class="pills" id="setKind"></div></div>
  <div class="settings-row col"><div><b>소리 크기</b></div><input type="range" id="setVol" min="0.1" max="1" step="0.05"></div>
  <div class="settings-row"><div><b>똑딱 소리</b><p>1초마다 작게</p></div><div class="seg" id="setTick"></div></div>
  <div class="settings-row"><div><b>음성 안내</b><p>구간 이름을 말해 줘요</p></div><div class="seg" id="setVoice"></div></div>
  <div class="settings-row col" id="voiceRow"><div><b>목소리</b></div><div style="display:flex;gap:8px"><select id="voiceSel"></select><button type="button" class="pill" data-act="tryVoice">들어보기</button></div></div>
  <div class="settings-row" id="silentRow"><div><b>무음 모드에서도 소리</b><p>켜 두면 폰으로 듣던 음악이 멈출 수 있어요</p></div><div class="seg" id="setSilent"></div></div>
  <div class="settings-row" id="vibRow"><div><b>진동</b><p>구간이 바뀔 때</p></div><div class="seg" id="setVib"></div></div>
  <p class="ver" id="ver"></p>
  <p class="ver" style="margin-top:2px">© Dongkyu Kim</p>
</div></div>
<div id="edit" class="panel" role="dialog" aria-modal="true" hidden><div class="sheet" id="editSheet"></div></div>
<div id="toast"></div>
<button type="button" id="upd" class="upd" hidden>새 버전이 있습니다 · 눌러서 새로고침</button>

<script>
const APP_VERSION = '26.11.07-1';                                      // 올릴 때마다 version.json · sw.js 와 같이 올린다
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const copy = o => JSON.parse(JSON.stringify(o));
// 바뀐 때만 다시 그린다. 운동 중엔 0.05초마다 그려서, 매번 새로 만들면 아이폰이 누르는 중이던 버튼의 누름을 버린다 (일시정지가 안 눌리던 버그)
const text = (el, value) => { const v = String(value); if (el.textContent !== v) el.textContent = v; };
const put = (el, html) => { if (el._h !== html) { el._h = html; el.innerHTML = html; } };
$('#ver').textContent = 'v' + APP_VERSION;

/* plan:start ── 모드·항목 정의와 구간 목록. 모든 모드를 "구간 목록" 하나로 펼쳐 같은 엔진으로 돌린다 (test_plan.mjs 가 확인) */
const FIELDS = {
  prep:      { name: '준비', lab: '준비', sub: '시작 전 카운트다운', time: 1, col: 'y' },
  work:      { name: '운동', lab: '운동', sub: '한 라운드 운동 시간', time: 1, col: 'g' },
  rest:      { name: '휴식', lab: '휴식', sub: '라운드 사이 쉬는 시간', time: 1, col: 'r' },
  rounds:    { name: '라운드', sub: '1라운드 = 운동 + 휴식', col: 'b', max: 99 },
  cycles:    { name: '사이클', sub: c => `1사이클 = ${c.rounds}라운드`, col: 'y', max: 99 },
  cycleRest: { name: '사이클 사이에 휴식', lab: '사이클 휴식', sub: '사이클 사이 쉬는 시간', time: 1, col: 'y' },
  cool:      { name: '쿨 다운', lab: '쿨 다운', sub: '운동 끝나고 정리 시간', time: 1, col: 'b' },
  lap:       { name: '타임 랩', lab: '운동', sub: '랩마다 소리로 알려 줘요', time: 1, col: 'g' },
};
const MODES = {
  tabata:    { name: '타바타', fields: ['prep', 'work', 'rest', 'rounds', 'cycles', 'cycleRest', 'cool'], def: { prep: 5, work: 60, rest: 15, rounds: 4, cycles: 12, cycleRest: 30, cool: 30 } },
  rounds:    { name: '라운드', fields: ['prep', 'work', 'rest', 'rounds', 'cool'], def: { prep: 5, work: 60, rest: 0, rounds: 40, cool: 30 } },
  stopwatch: { name: '스톱워치', fields: ['prep', 'lap'], def: { prep: 10, lap: 900 } },
};
// 마지막 라운드 뒤 휴식은 빼고(사이클 휴식이나 쿨 다운이 대신), 마지막 사이클 뒤 사이클 휴식도 뺀다. 0초 구간은 건너뛴다
function plan(mode, c) {
  const out = [], cyc = mode === 'tabata' ? c.cycles : 1;
  const add = (k, d, leftR, leftY, extra) => { if (d > 0) out.push({ k, d, lab: FIELDS[k].lab, leftR, leftY, ...extra }); };
  add('prep', c.prep, c.rounds || 0, cyc);
  if (mode === 'stopwatch') { out.push({ k: 'lap', d: Infinity, lab: FIELDS.lap.lab, leftR: 0, leftY: 0 }); }
  else {
    for (let y = 1; y <= cyc; y++) {
      for (let r = 1; r <= c.rounds; r++) {
        add('work', c.work, c.rounds - r + 1, cyc - y + 1, { last: y === cyc && r === c.rounds });
        if (r < c.rounds) add('rest', c.rest, c.rounds - r, cyc - y + 1);
      }
      if (y < cyc) add('cycleRest', c.cycleRest, c.rounds, cyc - y);
    }
    add('cool', c.cool, 0, 0);
  }
  let t = 0; for (const s of out) { s.start = t; t += s.d; }
  return out;
}
const totalOf = sg => sg.reduce((a, s) => a + (s.d === Infinity ? 0 : s.d), 0);
const pad = n => String(n).padStart(2, '0');
function fmt(sec) { sec = Math.max(0, Math.round(sec)); return `${pad(Math.floor(sec / 60))}:${pad(sec % 60)}`; }   // 한 시간이 넘어도 63:05 처럼 분:초
/* plan:end */

/* ── 저장 ── */
const KEY = 'wod-timer';
let S = load();
function load() {
  let s = {}; try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  const cfg = {}; for (const m in MODES) cfg[m] = { ...MODES[m].def, col: {}, ...(s.cfg && s.cfg[m]) };
  return { mode: MODES[s.mode] ? s.mode : 'tabata', cfg, saved: Array.isArray(s.saved) ? s.saved : [],
    set: { sound: true, kind: 'beep', vol: 1, tick: true, voice: false, voiceURI: '', silent: true, vib: true, ...s.set } };   // silent: 무음 모드에서도 소리 (처음엔 켬)
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const cfg = () => S.cfg[S.mode];
const PC = { y: 'var(--py)', g: 'var(--pg)', r: 'var(--pr)', b: 'var(--pb)' };
const colOf = (c, k) => PC[(c.col && c.col[k]) || FIELDS[k].col];
const svg = (d, w = 2, fill) => `<svg viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  play: svg('<path d="M8 5.2v13.6L19 12z"/>', 1.5, 1),
  pause: svg('<rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/>', 1, 1),
  chev: svg('<path d="m9 6 6 6-6 6"/>', 2.4).replace('<svg', '<svg class="chev"'),
  check: svg('<path d="M5 12.5 10 17 19 7"/>', 2.6),
  trash: svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
  tabata: svg('<circle cx="12" cy="14" r="7"/><path d="M12 14v-4M10 3h4M12 3v4M18 7l1.5-1.5"/>'),
  rounds: svg('<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>'),
  stopwatch: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
};

/* ── 타이머: 시작 시각과 쌓인 시간으로 계산 (화면이 잠깐 멈췄다 와도 시간이 밀리지 않는다) ── */
let T = null, loop = 0, lastFrame = null;
const modeTimers = Object.create(null);
const now = () => Date.now() / 1000;
const elapsed = () => T.acc + (T.run ? now() - T.t0 : 0);
function toggle() {
  try { unlockAudio(); } catch (e) { console.warn('소리 준비 실패', e); }
  if (T && T.done) T = null;
  if (!T) {
    const sg = plan(S.mode, cfg());
    if (!totalOf(sg) && S.mode !== 'stopwatch') { toast('운동 시간을 1초 이상으로 정해 주세요'); return; }
    T = { segs: sg, lap: S.mode === 'stopwatch' ? cfg().lap : 0, i: -1, acc: 0, run: true, t0: now(), sec: null };
  } else if (T.run) { T.acc = elapsed(); T.run = false; }
  else { T.t0 = now(); T.run = true; }
  run();
}
function reset() { T = null; modeTimers[S.mode] = null; run(); }
function switchMode(mode) {
  if (!MODES[mode] || mode === S.mode) return;
  if (T && T.run) { T.acc = elapsed(); T.run = false; }
  modeTimers[S.mode] = T;
  S.mode = mode; T = modeTimers[mode] || null;
  save(); run();
}
function run() { lastFrame = null; clearInterval(loop); if (T && T.run) loop = setInterval(frame, 50); wake(!!(T && T.run)); frame(); }
function frame() {
  if (T) {
    const e = elapsed(), sg = T.segs; let i = Math.max(T.i, 0);
    while (i < sg.length && e >= sg[i].start + sg[i].d) i++;
    if (i >= sg.length) {
      if (!T.done) { T.done = true; T.run = false; T.acc = totalOf(sg); clearInterval(loop); wake(false); cue('end'); }
    } else {
      if (i !== T.i) { T.i = i; T.sec = null; if (T.run) cue('go', sg[i]); }
      const s = sg[i], sec = s.d === Infinity ? Math.floor(e - s.start) : Math.ceil(s.start + s.d - e - 1e-6);
      if (sec !== T.sec) {
        const first = T.sec === null; T.sec = sec;
        if (!first && T.run) {
          if (s.d !== Infinity && sec >= 1 && sec <= 3) cue('count');
          else if (s.k === 'lap' && T.lap && sec > 0 && sec % T.lap === 0) cue('lap', sec / T.lap);
          else cue('tick');
        }
      }
    }
  }
  // 시간은 계속 계산하되 표시할 초·구간·실행 상태가 달라질 때만 그린다.
  const key = T ? `${T.i}:${T.sec}:${T.run}:${!!T.done}` : 'idle';
  if (key !== lastFrame) { lastFrame = key; draw(); }
}
function draw() {
  const c = cfg(), M = MODES[S.mode], sg = T ? T.segs : plan(S.mode, c), e = T ? elapsed() : 0, total = totalOf(sg);
  const done = T && T.done, i = T ? Math.max(T.i, 0) : 0, s = sg[i], n = sg[i + 1];
  document.body.classList.toggle('run', !!T);
  document.body.classList.toggle('going', !!(T && T.run));
  text($('#mname'), M.name);
  text($('#total'), S.mode === 'stopwatch' ? '' : fmt(done ? total : Math.ceil(total - e)));
  const pane = (id, lab, dig, pc) => { const p = $(id); p.classList.toggle('off', !pc); p.style.setProperty('--pc', pc || ''); text($(id + 'Lab'), lab); put($(id + 'Dig'), dig.replace(/\d/g, '<i>$&</i>')); };
  let curPc = '';
  if (done) { curPc = colOf(c, 'work'); pane('#cur', '완료', fmt(total || e), curPc); pane('#nxt', '처음부터 다시 하려면 시작', '', ''); }
  else if (!s) { pane('#cur', '시간을 정해 주세요', '00:00', ''); pane('#nxt', '오른쪽 위 버튼으로 바꿔요', '', ''); }
  else {
    curPc = colOf(c, s.k);
    const into = Math.max(0, e - s.start);
    pane('#cur', s.lab, s.d === Infinity ? fmt(T ? into : 0) : fmt(T ? Math.ceil(s.d - into - 1e-6) : s.d), curPc);
    const lap = T ? T.lap : c.lap;
    if (s.k === 'lap') {
      if (lap && T) pane('#nxt', `${Math.floor(into / lap) + 1}랩 끝까지`, fmt(lap - into % lap), colOf(c, 'lap'));
      else pane('#nxt', lap ? '타임 랩' : '타임 랩 없음', lap ? fmt(lap) : '', lap ? colOf(c, 'lap') : '');
    } else if (n) pane('#nxt', n.k === 'lap' ? '타임 랩' : n.lab, n.k === 'lap' ? (lap ? fmt(lap) : '없음') : fmt(n.d), colOf(c, n.k));
    else pane('#nxt', '마지막 구간', '', '');
  }
  $('#cur').classList.toggle('long', $('#curDig').textContent.length > 5);
  const stat = (id, show, v, pc) => { const el = $(id); el.style.visibility = show ? '' : 'hidden'; el.style.setProperty('--pc', pc); text(el.querySelector('b'), v); };
  stat('#statR', S.mode !== 'stopwatch', done || !s ? 0 : s.leftR, colOf(c, 'rounds'));
  stat('#statY', S.mode === 'tabata', done || !s ? 0 : s.leftY, colOf(c, 'cycles'));
  const go = $('.go'), running = T && T.run;
  go.style.setProperty('--pc', curPc || colOf(c, 'prep'));

  },
  addSaved: () => {                                                    // 이름 칸은 시트 안에 둔다. 앱 안 브라우저·일부 웹뷰는 prompt() 창을 띄우지 않고 멈춘다
    const name = ($('#newName').value.trim() || defName()).slice(0, 30);
    S.saved.push({ id: Date.now().toString(36), mode: S.mode, name, cfg: copy(E.d) }); save(); E.del = null; drawEdit(); toast(`'${name}' 추가됨`);
  },
  loadSaved: b => { const t = S.saved.find(x => x.id === b.dataset.id); if (!t) return; E.d = { ...MODES[S.mode].def, col: {}, ...copy(t.cfg) }; closeEdit(true); toast(`'${t.name}' 불러옴`); },
  askDel: b => { E.del = b.dataset.id; drawEdit(); },                  // 휴지통 한 번 = 확인 버튼, 그걸 누르면 지운다 (confirm() 창도 안 쓴다)
  delSaved: b => { const t = S.saved.find(x => x.id === b.dataset.id); if (!t) return; S.saved = S.saved.filter(x => x !== t); save(); E.del = null; drawEdit(); toast(`'${t.name}' 지움`); },
};
// 시작·일시정지: iOS의 지연 click 대신 손가락을 뗄 때 처리한다.
// 구간 전환 중에도 같은 버튼이 포인터를 유지한다. 끌기·취소·다중 터치는 실행하지 않는다.
function bindTap(button, activate) {
  let press = null, ignoreClickUntil = 0;
  button.addEventListener('pointerdown', ev => {
    if (ev.pointerType === 'mouse') return;
    ignoreClickUntil = 0;   // 새 터치는 이전 터치의 중복 click 억제와 무관하다
    if (!ev.isPrimary || press) { press = null; return; }
    press = { id: ev.pointerId, x: ev.clientX, y: ev.clientY, moved: false };
    button.setPointerCapture(ev.pointerId);
  });
  button.addEventListener('pointermove', ev => {
    if (press && press.id === ev.pointerId && Math.hypot(ev.clientX - press.x, ev.clientY - press.y) > 16) press.moved = true;
  });
  button.addEventListener('pointerup', ev => {
    if (!press || press.id !== ev.pointerId) return;
    const p = press; press = null; ignoreClickUntil = performance.now() + 800;
    ev.preventDefault();
    const r = button.getBoundingClientRect();
    if (!p.moved && ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) activate();
  });
  button.addEventListener('pointercancel', () => { press = null; });
  button.addEventListener('lostpointercapture', () => { press = null; });
  button.addEventListener('click', ev => {
    // touch 뒤 자동 click이 한 번 더 실행돼 곧바로 재시작하는 것을 막는다. 키보드·보조기술 click은 유지.
    if (ev.detail > 0 && performance.now() < ignoreClickUntil) {
      ev.preventDefault(); ev.stopImmediatePropagation();
    }
  });
}
for (const button of [$('#play'), $('#playLand')]) bindTap(button, toggle);
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act],[data-tab],[data-set],[data-kind],[data-pickcolor],[data-pc]');
  if (!b) { if (ev.target.classList.contains('panel')) back(); return; }
  const d = b.dataset;
  if (d.act) ACT[d.act](b);
  else if (d.tab) {
    switchMode(d.tab);
  }
  else if (d.set) {
    S.set[d.set] = d.v === '1'; save();
    if (d.set === 'silent') { setSession(); if (AC) { AC.close().catch(() => {}); AC = null; } unlockAudio(); tone(...SND[S.set.kind].count); }
    if (d.set === 'voice') unlockAudio();
    drawSettings();
  }
  else if (d.kind) { S.set.kind = d.kind; save(); unlockAudio(); tone(...SND[d.kind].go); drawSettings(); }
  else if (d.pickcolor) { setColor(d.pickcolor); barDirty = true; }
  else if (d.pc) { E.pc = d.pc; b.parentElement.querySelectorAll('button').forEach(x => { x.innerHTML = x === b ? ICON.check : ''; }); }
});
$('#setVol').addEventListener('input', function () { S.set.vol = +this.value; save(); });
$('#setVol').addEventListener('change', () => { unlockAudio(); tone(...SND[S.set.kind].count); });
$('#voiceSel').addEventListener('change', function () { S.set.voiceURI = this.value; save(); say('운동'); });
addEventListener('keydown', ev => {                                   // 맥·키보드: 스페이스 = 시작/일시정지, Esc = 닫기
  if (ev.key === 'Enter' && ev.target.id === 'newName') { ev.preventDefault(); ACT.addSaved(); }
  else if (ev.key === 'Escape' && anyOpen()) { back(); syncHistory(); }
  else if (ev.key === ' ' && !anyOpen() && !/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) { ev.preventDefault(); toggle(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (T && T.run) wake(true);
  resumeAudio();
  frame();
});
// 아이폰은 앱을 나갔다 오면 소리를 '중단됨'으로 두고, 터치 없이는 다시 못 켠다. 아무 데나 처음 닿을 때 깨운다
addEventListener('pointerdown', () => { resumeAudio(); }, { passive: true });

/* ── 가로·세로 배치: 구간 이름과 다음 구간만 옮긴다. 조작 버튼은 각 방향의 고정 자리를 쓴다 ── */
const LAND = matchMedia('(orientation: landscape)');
function layout() {
  const top = $('.top'), L = $('.top .l'), R = $('.top .r'), go = $('.go');
  if (LAND.matches) { L.append($('.ttl')); top.insertBefore($('#curLab'), R); go.append($('#nxt')); }
  else { top.insertBefore($('.ttl'), R); $('#cur').prepend($('#curLab')); $('#app').insertBefore($('#nxt'), $('.ctl')); }
}
LAND.addEventListener('change', layout);
layout();

setTheme(theme); setColor(color); draw();
for (const tab of $('#tabs').children) bindTap(tab, () => switchMode(tab.dataset.tab));

// ── 확대 막기: 두 손가락 핀치, 빈 곳 더블탭 (도시메트리 캘린더·웬들러와 같은 방식) ──
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  // 두 손가락: 시작부터 막는다 (갤럭시는 touchmove 만 막으면 일부 영역에서 확대가 시작됨)
  ['touchstart', 'touchmove'].forEach(t => document.addEventListener(t, e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false }));
  let lastEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now(), onControl = e.target.closest && e.target.closest('button,input,textarea,select,label,a,summary,.wheel');
    if (!onControl && now - lastEnd < 350) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
  document.addEventListener('dblclick', stop, { passive: false });
})();

// ── 새 버전 안내: version.json 과 비교해서 다르면 버튼. 누르면 오프라인 보관본을 비우고 새로 받는다 ──
(() => {
  let latest = '';
  const check = () => fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(j => { if (j && j.version && j.version !== APP_VERSION) { latest = j.version; $('#upd').hidden = !!T; } })
    .catch(() => {});
  $('#upd').addEventListener('click', () => {
    $('#upd').textContent = '새로 받는 중';
    Promise.all([
      window.caches ? caches.keys().then(ks => Promise.all(ks.filter(k => k !== 'fonts-v1').map(k => caches.delete(k)))) : null,
      'serviceWorker' in navigator ? navigator.serviceWorker.getRegistration().then(r => r && r.update()) : null,
    ].map(p => Promise.resolve(p).catch(() => {}))).then(() => location.replace('./?v=' + encodeURIComponent(latest || Date.now())));
  });
  window.addEventListener('load', () => { if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {}); check(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !T) check(); });
})();
</script>
